<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Typing Speed Test</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>Typing Speed Test</h1>
    <button id="start-btn">Start Test</button>
    <div class="paragraph" id="paragraph">Click start to begin the test.</div>
    <textarea id="input-area" placeholder="Type here..." disabled></textarea>
    <button id="done-btn" disabled>Done</button>
    <div id="result"></div>
  </div>
  <script src="script.js"></script>
</body>
</html>
